name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    name: bridge programs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests -q
      - name: windowless check over the bridge's programs
        run: python .claude/cursor-bridge/windowless-check.py .claude/cursor-bridge
      - name: the manifest matches the tree
        run: python .claude/cursor-bridge/bridge-check.py --root .claude --quiet
